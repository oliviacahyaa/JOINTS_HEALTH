<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><title>CareDiabetes</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f8f9;--card:#fff;--ink:#12303a;--mut:#4a6570;--line:#d9e6e9;--pri:#0e7c86;--pri2:#0a5d66;--priT:#e0f2f3;--ok:#1b7f48;--okT:#e0f4e8;--warn:#9a5b00;--warnT:#fff0d4;--bad:#b42a24;--badT:#fde4e2;--inf:#1f5fa6;--infT:#e1edfa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1b20;--card:#16282f;--ink:#e8f2f4;--mut:#a3bcc3;--line:#2a424a;--pri:#4cc3cd;--pri2:#7fd8df;--priT:#17383d;--ok:#5fd18f;--okT:#163524;--warn:#f0b24c;--warnT:#3a2c10;--bad:#ff8a82;--badT:#3c1a18;--inf:#7db4ee;--infT:#142b44}}
:root[data-theme="dark"]{--bg:#0e1b20;--card:#16282f;--ink:#e8f2f4;--mut:#a3bcc3;--line:#2a424a;--pri:#4cc3cd;--pri2:#7fd8df;--priT:#17383d;--ok:#5fd18f;--okT:#163524;--warn:#f0b24c;--warnT:#3a2c10;--bad:#ff8a82;--badT:#3c1a18;--inf:#7db4ee;--infT:#142b44}
*{box-sizing:border-box}html{font-size:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:1rem/1.55 'Atkinson Hyperlegible',system-ui,sans-serif}
h1{font-size:1.9rem;margin:0 0 .3rem;line-height:1.2}h2{font-size:1.3rem;margin:0 0 .6rem}h3{font-size:1.1rem;margin:0 0 .3rem}p{margin:.2rem 0}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
.side{width:250px;background:var(--card);border-right:1px solid var(--line);padding:1.2rem .8rem;position:sticky;top:0;height:100vh;overflow:auto;flex:none}
.logo{font-weight:700;font-size:1.4rem;color:var(--pri);padding:0 .6rem 1rem}.logo span{color:var(--ink)}
.nav{display:flex;align-items:center;gap:.7rem;width:100%;text-align:left;border:0;background:none;padding:.75rem .8rem;border-radius:12px;font-size:1.05rem;cursor:pointer;margin-bottom:2px}
.nav:hover{background:var(--priT)}.nav.on{background:var(--pri);color:#fff;font-weight:700}
main{flex:1;min-width:0;padding:1.6rem clamp(1rem,3vw,2.4rem) 3rem;max-width:1100px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:1rem;margin-bottom:1.2rem;flex-wrap:wrap}
.sub{color:var(--mut)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem;margin-bottom:1.2rem}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:1.1rem 1.2rem;margin-bottom:1rem}.grid .card{margin:0}
.big{font-size:2rem;font-weight:700;line-height:1.1}
.badge{display:inline-block;padding:.2rem .7rem;border-radius:99px;font-size:.9rem;font-weight:700}
.b-ok{background:var(--okT);color:var(--ok)}.b-warn{background:var(--warnT);color:var(--warn)}.b-bad{background:var(--badT);color:var(--bad)}.b-inf{background:var(--infT);color:var(--inf)}
.btn{border:2px solid var(--pri);background:var(--pri);color:#fff;border-radius:14px;padding:.85rem 1.3rem;font-weight:700;font-size:1.05rem;cursor:pointer;min-height:52px}
.btn:hover{background:var(--pri2);border-color:var(--pri2)}.btn.alt{background:transparent;color:var(--pri)}.btn.alt:hover{background:var(--priT)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.sm{min-height:44px;padding:.5rem 1rem}
.btn:focus-visible,.nav:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--inf);outline-offset:2px}
.acts{display:flex;gap:.8rem;flex-wrap:wrap;margin-bottom:1.2rem}.acts .btn{flex:1;min-width:210px}
.moods{display:grid;grid-template-columns:repeat(auto-fit,minmax(110px,1fr));gap:.6rem}
.mood{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:.7rem .3rem;font-size:1rem;cursor:pointer}.mood b{display:block;font-size:1.8rem}.mood.on{border-color:var(--pri);background:var(--priT)}
.alert{display:flex;gap:.8rem;align-items:flex-start;padding:.9rem 1rem;border-radius:14px;margin-bottom:.7rem;border-left:6px solid}
.a-warn{background:var(--warnT);border-color:var(--warn)}.a-ok{background:var(--okT);border-color:var(--ok)}.a-inf{background:var(--infT);border-color:var(--inf)}.a-bad{background:var(--badT);border-color:var(--bad)}
.alert .i{font-size:1.5rem}.alert small{display:block;color:var(--mut)}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:.7rem .6rem;border-bottom:1px solid var(--line)}th{color:var(--mut);font-size:.95rem}
.tw{overflow-x:auto}tr.click{cursor:pointer}tr.click:hover{background:var(--priT)}
.tabs{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem}.tab{border:2px solid var(--line);background:var(--card);border-radius:99px;padding:.5rem 1.1rem;cursor:pointer;font-weight:700}.tab.on{background:var(--pri);color:#fff;border-color:var(--pri)}
label{display:block;font-weight:700;margin:.8rem 0 .3rem}input,select,textarea{width:100%;padding:.75rem;border:2px solid var(--line);border-radius:12px;background:var(--card);min-height:48px}
.radio{display:flex;gap:.5rem;flex-wrap:wrap}.radio label{margin:0;font-weight:400;display:flex;align-items:center;gap:.4rem;border:2px solid var(--line);border-radius:12px;padding:.5rem .8rem;width:auto}.radio input{width:auto;min-height:0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:.6rem;margin-top:.8rem}.stat{background:var(--bg);border-radius:12px;padding:.6rem .8rem}.stat b{font-size:1.3rem;display:block}
.tl{border-left:3px solid var(--pri);margin-left:.6rem;padding-left:1.2rem}.tl>div{position:relative;margin-bottom:1.1rem}.tl>div:before{content:"";position:absolute;left:-1.7rem;top:.35rem;width:14px;height:14px;border-radius:50%;background:var(--pri);border:3px solid var(--bg)}
.ph{width:110px;height:80px;border-radius:12px;background:linear-gradient(135deg,var(--priT),var(--line));display:grid;place-items:center;font-size:1.6rem;margin-top:.3rem;object-fit:cover}
.bars{display:flex;gap:6px;align-items:flex-end;height:90px;margin-top:.5rem}.bars i{flex:1;background:var(--ok);border-radius:6px 6px 0 0;min-height:6px}.bars i.m{background:var(--warn)}
.modal{position:fixed;inset:0;background:rgba(5,20,25,.55);display:grid;place-items:center;padding:1rem;z-index:20}.modal .card{width:min(520px,100%);max-height:92vh;overflow:auto;margin:0}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ok);color:#fff;padding:.9rem 1.4rem;border-radius:14px;font-weight:700;z-index:30;max-width:92vw}
.login{min-height:100vh;display:grid;place-items:center;padding:1rem;background:linear-gradient(160deg,var(--priT),var(--bg))}.login .card{width:min(430px,100%);padding:2rem}
.row{display:flex;justify-content:space-between;align-items:center;gap:.8rem;flex-wrap:wrap}
.disc{font-size:.9rem;color:var(--mut);text-align:center;margin-top:2rem}
.tgl{display:flex;justify-content:space-between;align-items:center;padding:.7rem 0;border-bottom:1px solid var(--line)}.tgl input{width:28px;min-height:0;height:28px}
@media(max-width:800px){.app{display:block}.side{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;display:flex;overflow-x:auto;padding:.3rem .4rem calc(.3rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);border-right:0;z-index:10}.logo{display:none}.nav{flex-direction:column;gap:0;width:auto;min-width:76px;font-size:.8rem;padding:.4rem;text-align:center}.nav b{font-size:1.4rem;font-weight:400}main{padding-bottom:6rem}h1{font-size:1.5rem}.top{padding-top:.4rem}}
.pb{height:10px;background:var(--line);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%}.acts.fu .btn{min-width:0;flex:none}

/* ---- polish ---- */
.card{box-shadow:0 1px 2px rgba(18,48,58,.05),0 6px 18px rgba(18,48,58,.04)}
.modal .card{box-shadow:0 24px 60px rgba(5,20,25,.35)}
h1,h2{letter-spacing:-.01em}
.btn,.tab,.nav,.mood,input,select,textarea{transition:background-color .15s,border-color .15s,color .15s}
.btn:active{transform:translateY(1px)}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.radio label:has(input:checked){border-color:var(--pri);background:var(--priT);font-weight:700}
th{white-space:nowrap}tr:last-child td{border-bottom:0}
.badge{white-space:nowrap}
.stat{border:1px solid var(--line)}
.modal-acts{margin:1rem 0 0}
.nav{font-weight:400}.nav.on{font-weight:700}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body><div id="app"></div>
<script>
const $=s=>document.querySelector(s);

/* ===== KEAMANAN (simulasi di browser; yang asli harus di server) =====
   Password di-hash PBKDF2-SHA256 (210.000 iterasi) + salt acak per akun,
   jadi password asli tidak pernah disimpan. */
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
async function hashPw(pw,salt){const enc=new TextEncoder(),k=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveBits']);return hex(await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:210000,hash:'SHA-256'},k,256))}

/* ===== STATE & DATA CONTOH ===== */
const S={role:null,auth:'login',rt:'obat',done:{},users:[],name:'',dtype:'Tipe 2',scr:null,page:'dash',tab:'',pat:'siti',mood:2,filter:'Semua',per:7,size:'100%',dark:null,wdone:false,notes:['Pertahankan pola makan dan konsumsi obat sesuai jadwal. Lakukan pengukuran gula darah secara rutin. — dr. Andi Wijaya, 10 Sep 2026']};
const bs=[{d:'13 Okt',t:'08:15',v:128,k:'Sebelum makan',n:'-'},{d:'12 Okt',t:'08:10',v:135,k:'Sebelum makan',n:'-'},{d:'11 Okt',t:'08:05',v:132,k:'Puasa',n:'-'},{d:'10 Okt',t:'13:30',v:162,k:'Setelah makan',n:'Makan nasi agak banyak'},{d:'09 Okt',t:'08:00',v:130,k:'Puasa',n:'-'}];
const meds=[{n:'Metformin 500 mg',dose:'1 tablet',t:'08:00',r:'Setelah makan',at:'08:12'},{n:'Vitamin B12',dose:'1 tablet',t:'12:00',r:'Setelah makan siang',at:'12:05'},{n:'Glimepiride 2 mg',dose:'1 tablet',t:'19:00',r:'Bersama makan malam',at:null}];
const ser=Array.from({length:180},(_,i)=>Math.round(130+14*Math.sin(i/3.1)+((i*37)%11-5)*1.6));ser[179]=128;
const P={siti:{n:'Siti Rahmawati',u:68,g:128,o:92,l:'Dirawat',k:'5 hari',s:'Baik',c:'ok',off:0},budi:{n:'Budi Santoso',u:72,g:165,o:80,l:'Perlu perhatian',k:'2 hari',s:'Perlu diperhatikan',c:'warn',off:28}};
const wl=[{d:'13 Okt 2026 — 08:15',by:'Andi',c:'Tidak ada perubahan signifikan',n:'Perawatan dilakukan sesuai instruksi dokter.'},{d:'12 Okt 2026 — 08:05',by:'Ibu Siti',c:'Luka tampak lebih kering',n:'Tidak ada keluhan.'}];
const photos=[{d:'10 Oktober',t:'Foto pertama'},{d:'13 Oktober',t:'Foto terbaru'}];
const N=[{i:'💊',c:'warn',t:'Obat',m:'Glimepiride malam belum dikonfirmasi. Jangan lupa minum obat sesuai jadwal.',w:'19:05'},{i:'🩸',c:'inf',t:'Gula darah',m:'Data pada 10 Okt perlu diperhatikan sesuai target yang ditetapkan dokter.',w:'10 Okt'},{i:'🩺',c:'inf',t:'Konsultasi',m:'Jadwal konsultasi dengan dr. Andi dalam 5 hari (18 Okt, 09:00).',w:'Hari ini'},{i:'🩹',c:'warn',t:'Luka',m:'Perawatan luka kaki kanan belum dikonfirmasi hari ini.',w:'08:30'},{i:'✅',c:'ok',t:'Obat',m:'Metformin pagi sudah dikonfirmasi pukul 08:12.',w:'08:12'}];
const ND=[['dash','🏠','Dashboard'],['gula','🩸','Gula Darah'],['obat','💊','Obat'],['luka','🩹','Perawatan Luka'],['konsul','🩺','Konsultasi'],['kondisi','❤️','Kondisi Saya'],['riwayat','📊','Riwayat'],['tindak','🚨','Tindak Lanjut'],['notif','🔔','Notifikasi'],['screen','🧪','Screening'],['keluarga','👨‍👩‍👧','Keluarga'],['set','⚙️','Pengaturan']];
const DD=[['dash','🏠','Dashboard'],['dash','👥','Pasien'],['d:gula','🩸','Gula Darah'],['d:obat','💊','Obat'],['d:luka','🩹','Luka'],['d:konsul','🩺','Konsultasi'],['d:riwayat','📊','Riwayat'],['tindak','🚨','Tindak Lanjut'],['notif','🔔','Notifikasi'],['set','⚙️','Pengaturan']];
const bd=(c,t)=>`<span class="badge b-${c}">${t}</span>`;
const al=(c,i,t,s='')=>`<div class="alert a-${c}"><span class="i">${i}</span><div><b>${t}</b><small>${s}</small></div></div>`;
function toast(m){const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=m;document.body.appendChild(e);setTimeout(()=>e.remove(),2600)}
function modal(h){const m=document.createElement('div');m.className='modal';m.id='mod';m.innerHTML=`<div class="card" role="dialog" aria-modal="true">${h}</div>`;m.onclick=e=>{if(e.target===m)m.remove()};document.body.appendChild(m)}
const closeM=()=>$('#mod')?.remove();
function go(p,t){if(p.startsWith('d:')){S.page='detail';S.tab=p.slice(2)}else{S.page=p;S.tab=t||''}render();scrollTo(0,0)}
function chart(n,off=0){const a=ser.slice(180-n).map(v=>v+off),W=600,H=240,x=i=>44+i*(540/(n-1)),y=v=>16+(200-v)/140*190;
let g=[80,120,160,200].map(v=>`<line x1="44" x2="584" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="4" y="${y(v)+4}" fill="var(--mut)" font-size="13">${v}</text>`).join('');
const band=`<rect x="44" width="540" y="${y(140)}" height="${y(90)-y(140)}" fill="var(--okT)"/><text x="50" y="${y(140)+15}" fill="var(--ok)" font-size="12">Target dokter 90–140</text>`;
const pts=a.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
const dots=n<=30?a.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v)}" r="5" fill="${v>140+off?'var(--warn)':'var(--pri)'}"><title>${v} mg/dL, ${n-1-i} hari lalu</title></circle>`).join(''):'';
const mx=Math.max(...a),mn=Math.min(...a),av=Math.round(a.reduce((s,v)=>s+v,0)/n);
return `<div class="tw"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:420px" role="img" aria-label="Grafik gula darah ${n} hari">${g}${band}<polyline points="${pts}" fill="none" stroke="var(--pri)" stroke-width="3" stroke-linejoin="round"/>${dots}<text x="44" y="236" fill="var(--mut)" font-size="13">${n} hari lalu</text><text x="584" y="236" fill="var(--mut)" font-size="13" text-anchor="end">Hari ini</text></svg></div><div class="stats"><div class="stat">Tertinggi<b>${mx}</b></div><div class="stat">Terendah<b>${mn}</b></div><div class="stat">Rata-rata<b>${av}</b></div><div class="stat">Terakhir<b>${a[n-1]}</b></div></div>`}
const periods=()=>`<div class="tabs">${[[7,'7 hari'],[30,'30 hari'],[90,'3 bulan'],[180,'6 bulan']].map(([n,l])=>`<button class="tab ${S.per==n?'on':''}" onclick="S.per=${n};render()">${l}</button>`).join('')}</div>`;
const medDone=()=>meds.filter(m=>m.at).length;
function bsTable(){const f=bs.filter(r=>S.filter=='Semua'||r.k==S.filter);return `<div class="tabs">${['Semua','Sebelum makan','Setelah makan','Puasa','Lainnya'].map(k=>`<button class="tab ${S.filter==k?'on':''}" onclick="S.filter='${k}';render()">${k}</button>`).join('')}</div><div class="tw"><table><tr><th>Tanggal</th><th>Waktu</th><th>Gula darah</th><th>Kondisi</th><th>Catatan</th></tr>${f.map(r=>`<tr><td>${r.d}</td><td>${r.t}</td><td><b>${r.v} mg/dL</b> ${r.v>160?bd('warn','Perlu diperhatikan'):''}</td><td>${r.k}</td><td>${r.n}</td></tr>`).join('')||'<tr><td colspan=5>Belum ada data untuk filter ini.</td></tr>'}</table></div>`}
function addBS(){modal(`<h2>Tambah Pengukuran Gula Darah</h2><label>Tanggal</label><input id="f1" type="date" value="2026-10-13"><label>Waktu</label><input id="f2" type="time" value="08:15"><label>Kadar gula darah (mg/dL)</label><input id="f3" type="number" value="128" inputmode="numeric"><label>Kondisi</label><div class="radio">${['Sebelum makan','Setelah makan','Puasa','Lainnya'].map((k,i)=>`<label><input type="radio" name="k" value="${k}" ${i==0?'checked':''}>${k}</label>`).join('')}</div><label>Catatan</label><textarea id="f4" rows="2"></textarea><div class="acts modal-acts"><button class="btn" onclick="saveBS()">Simpan Data</button><button class="btn alt" onclick="closeM()">Batal</button></div>`)}
function saveBS(){const v=+$('#f3').value;if(!v||v<20||v>600){toast('Masukkan angka gula darah yang benar.');return}const d=new Date($('#f1').value||'2026-10-13');bs.unshift({d:String(d.getDate()).padStart(2,'0')+' '+['Jan','Feb','Mar','Apr','Mei','Jun','Jul','Agu','Sep','Okt','Nov','Des'][d.getMonth()],t:$('#f2').value,v,k:document.querySelector('[name=k]:checked').value,n:$('#f4').value||'-'});delete S.done.gl;closeM();render();toast('Data gula darah berhasil dicatat.');const a=glAlert(v);if(a)setTimeout(()=>followModal(a),300)}
function taken(i){if(stock[i])stock[i].left=Math.max(0,stock[i].left-1);const n=new Date();meds[i].at=String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0');render();toast('Terima kasih. '+meds[i].n+' sudah dicatat.')}
function remind(i){modal(`<h2>🔔 Saatnya minum obat</h2><p style="font-size:1.2rem"><b>${meds[i].n}</b><br>${meds[i].dose} ${meds[i].r.toLowerCase()}.</p><div class="acts modal-acts"><button class="btn ok" onclick="closeM();taken(${i})">Sudah Minum</button><button class="btn alt" onclick="closeM();toast('Kami akan mengingatkan lagi 15 menit lagi.')">Ingatkan Lagi</button></div><p class="sub" style="margin-top:1rem">Jika belum dikonfirmasi, keluarga akan mendapat pengingat. Sistem tidak mengubah dosis obat.</p>`)}
function medCards(){return `<div class="grid">${meds.map((m,i)=>`<div class="card"><h3>${m.n}</h3><p>Dosis: <b>${m.dose}</b></p><p>Waktu: <b>${m.t}</b> · ${m.r}</p><p style="margin:.6rem 0">${m.at?bd('ok','✓ Sudah diminum '+m.at):bd('warn','⏰ Belum diminum')}</p>${m.at?'':`<button class="btn ok" style="width:100%" onclick="taken(${i})">Sudah Minum</button><button class="btn alt sm" style="width:100%;margin-top:.5rem" onclick="remind(${i})">Lihat pengingat</button>`}</div>`).join('')}</div>`}
function medHist(){const r=[['13 Okt','Metformin','08:00','08:12','✓'],['13 Okt','Glimepiride','19:00','-','Belum'],['12 Okt','Metformin','08:00','08:05','✓'],['12 Okt','Glimepiride','19:00','19:10','✓'],['11 Okt','Metformin','08:00','08:30','✓']];const v=[1,1,1,0.6,1,1,0.7];return `<div class="card"><div class="row"><h2>Kepatuhan minum obat</h2>${bd('ok','Medication Adherence: 92%')}</div><div class="bars" aria-label="Kepatuhan 7 hari">${v.map(x=>`<i class="${x<.9?'m':''}" style="height:${x*100}%"></i>`).join('')}</div><p class="sub">7 hari terakhir. Batang kuning = ada obat terlewat.</p></div><div class="card tw"><table><tr><th>Tanggal</th><th>Obat</th><th>Jadwal</th><th>Diminum</th><th>Status</th></tr>${r.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td><td>${x[4]=='✓'?bd('ok','✓ Sudah'):bd('warn','Belum')}</td></tr>`).join('')}</table></div>`}
function wound(){return `<div class="card"><div class="row"><div><h2>Luka kaki kanan</h2><p>Ditemukan <b>10 Okt 2026</b> · Ukuran <b>2 cm × 1,5 cm</b> · Rasa sakit <b>3/10</b></p><p>Kondisi: ${bd('inf','Sedang dalam perawatan')}</p></div><button class="btn alt" onclick="addWound()">+ Tambah Luka</button></div></div>
<div class="card"><h2>Pengingat perawatan</h2><p>Jadwal: <b>Setiap hari pukul 08:00</b></p><p style="margin:.6rem 0">${S.wdone?bd('ok','✓ Hari ini sudah dilakukan'):bd('warn','⚠️ Belum dilakukan')}</p>${S.wdone?'':al('warn','🔔','Pengingat Perawatan Luka','Jangan lupa melakukan perawatan luka kaki kanan sesuai instruksi tenaga kesehatan.')+`<button class="btn ok" onclick="careWound()">🩹 Tandai Sudah Dirawat</button>`}</div>

function glAlert(v){const A=(l,t,w,s)=>({id:'gl',l,i:'🩸',t,w,s});

if(v>=300)return A(3,'Gula darah sangat tinggi ('+v+' mg/dL)','Perlu penilaian tenaga medis segera.',['Hubungi dokter sekarang.','Jika mual, muntah, napas cepat/berbau buah, nyeri perut, sangat lemas atau bingung: segera ke IGD.','Minum air putih, hindari olahraga berat.','Keluarga diberi tahu otomatis.']);

return null}

const mm=meds.filter(m=>!m.at);if(mm.length)o.push({id:'med',l:mm.length>1?2:1,i:'💊',t:mm.map(m=>m.n.split(' ')[0]).join(', ')+' belum diminum',w:'Jadwal: '+mm.map(m=>m.t).join(', ')+'.',s:['Minum sekarang jika belum mendekati dosis berikutnya. Ragu? Tanya dokter/apoteker.','Jangan menggandakan dosis untuk mengganti yang terlewat.','Pengingat ulang 15 menit; jika 1 jam belum dikonfirmasi, keluarga diberi tahu.','Jika terlewat ≥2 dosis berturut-turut, dokter diberi tahu (Level 2).']});
const w=woundAlert();if(w)o.push(w);
const st=stock.filter(s=>s.left/s.per<=7);if(st.length)o.push({id:'stk',l:st.some(s=>s.left/s.per<=3)?2:1,i:'📦',t:'Stok menipis: '+st.map(s=>s.n.split(' ')[0]+' ('+s.left+')').join(', '),w:'Stok habis berisiko membuat obat terlewat.',s:['Minta resep ulang ke dokter/klinik (tombol di bawah).','Tebus di apotek sebelum habis. Jangan mengurangi dosis sendiri untuk menghemat.','Minta keluarga membantu membeli atau mengantar.']});
return o.filter(x=>!S.done[x.id]).sort((a,b)=>b.l-a.l)}
const fuCard=(x,c)=>`<div class="alert a-${lvC[x.l]}"><span class="i">${x.i}</span><div style="flex:1"><b>${x.t}</b> ${bd(lvC[x.l],lvN[x.l])}<small>${x.w}</small>${c?'':`<ol style="margin:.5rem 0 .5rem 1.1rem;padding:0">${x.s.map(s=>`<li>${s}</li>`).join('')}</ol>`}<div class="acts fu" style="margin:.5rem 0 0">${x.l>=2?`<button class="btn sm" onclick="act('${x.id}','dr')">📞 ${x.id=='stk'?'Minta resep ulang':'Hubungi dokter'}</button>`:''}<button class="btn alt sm" onclick="act('${x.id}','fam')">👨‍👩‍👧 Beri tahu keluarga</button><button class="btn ok sm" onclick="act('${x.id}','ok')">✓ Sudah ditangani</button></div></div></div>`;
function followUp(c){const a=alerts();if(!a.length)return al('ok','✅','Semua aman','Tidak ada yang perlu ditindaklanjuti.');return `<div class="card"><div class="row"><h2>🚨 Perlu tindak lanjut (${a.length})</h2>${c?`<button class="btn alt sm" onclick="go('tindak')">Lihat langkah lengkap</button>`:''}</div>${a.slice(0,c?3:99).map(x=>fuCard(x,c)).join('')}</div>`}
function act(id,w){if(w=='ok'){S.done[id]=1;render()}toast({dr:id=='stk'?'Permintaan resep ulang dikirim ke dr. Andi Wijaya.':'Permintaan dihubungi dikirim ke dr. Andi Wijaya.',fam:'Notifikasi dikirim ke keluarga (Andi).',ok:'Ditandai sudah ditangani.'}[w])}
function followModal(a){modal(`<h2>${a.i} ${a.t}</h2><p>${bd(lvC[a.l],lvN[a.l])}</p><p class="sub" style="margin:.5rem 0">${a.w}</p><ol style="padding-left:1.2rem">${a.s.map(s=>`<li>${s}</li>`).join('')}</ol>${a.l==3?al('bad','🚑','Darurat','Hubungi 119 atau ke IGD terdekat.'):''}<div class="acts modal-acts"><button class="btn" onclick="act('${a.id}','dr');closeM()">📞 Hubungi dokter</button><button class="btn alt" onclick="closeM()">Tutup</button></div>`)}
function ladder(){return `<div class="card tw"><h2>Aturan tindak lanjut</h2><table><tr><th>Kondisi</th><th>Level 1 · Pantau</th><th>Level 2 · Hubungi hari ini</th><th>Level 3 · Darurat</th></tr><tr><td><b>Gula darah</b></td><td>&gt; 160 mg/dL</td><td>≥ 250, atau tinggi 2 dari 3 pengukuran</td><td>≥ 300 + gejala berat, atau &lt; 70 tidak membaik</td></tr><tr><td><b>Obat</b></td><td>1 dosis terlewat: pengingat ulang 15 menit</td><td>≥ 2 dosis / 1 jam tanpa konfirmasi: keluarga &amp; dokter diberi tahu</td><td>Gejala berat setelah terlewat: IGD</td></tr><tr><td><b>Luka</b></td><td>Belum dirawat hari ini</td><td>Tampak memburuk</td><td>Demam, nanah, bau, merah meluas</td></tr><tr><td><b>Stok</b></td><td>Sisa ≤ 7 hari</td><td>Sisa ≤ 3 hari: minta resep ulang</td><td>Habis: obat terlewat</td></tr></table><p class="sub" style="margin-top:.6rem">Ambang adalah standar awal; dokter dapat mengubah target pasien. Aplikasi tidak mengubah dosis obat.</p></div>`}
function stokView(){return `<div class="card"><h2>Stok obat &amp; perlengkapan</h2>${stock.map((s,i)=>{const d=Math.floor(s.left/s.per),c=d<=3?'bad':d<=7?'warn':'ok';return `<div style="padding:.7rem 0;border-bottom:1px solid var(--line)"><div class="row"><b>${s.n}</b>${bd(c,d<=3?'Segera isi ulang':d<=7?'Menipis':'Aman')}</div><p class="sub">Sisa ${s.left} ${s.u} · cukup ± ${d} hari</p><div class="pb"><i style="width:${Math.min(100,d/30*100)}%;background:var(--${c})"></i></div><button class="btn alt sm" style="margin-top:.5rem" onclick="refill(${i})">+ Catat isi ulang</button></div>`}).join('')}<button class="btn" style="margin-top:1rem" onclick="act('stk','dr')">Minta resep ulang ke dokter</button></div>`}
function refill(i){modal(`<h2>Isi ulang ${stock[i].n}</h2><label>Jumlah (${stock[i].u})</label><input id="rq" type="number" value="30" min="1"><div class="acts modal-acts"><button class="btn" onclick="const q=+$('#rq').value;if(q>0){stock[${i}].left+=q;delete S.done.stk;closeM();render();toast('Stok diperbarui.')}">Simpan</button><button class="btn alt" onclick="closeM()">Batal</button></div>`)}
function timeline(){const T=[['obat','💊 Obat'],['luka','🩹 Luka'],['kontrol','🩺 Kontrol'],['stok','📦 Stok']],t=S.rt;
const luka=`<div class="card"><h2>Riwayat perawatan luka</h2>${wl.map(l=>`<div style="padding:.6rem 0;border-bottom:1px solid var(--line)"><b>${l.d}</b><br>Dirawat oleh: ${l.by}<br>Kondisi: ${l.c}<br><span class="sub">${l.n}</span></div>`).join('')}</div><div class="card"><h2>Foto perkembangan</h2><div class="tl">${photos.map(p=>`<div><b>${p.d}</b> · ${p.t}${p.u?`<br><img class="ph" src="${p.u}" alt="Foto luka">`:''}</div>`).join('')}</div></div>`;
const kontrol=`<div class="card"><h2>Riwayat kontrol</h2><div class="tl"><div><b>18 Okt 2026</b> · Kontrol Diabetes ${bd('inf','Terjadwal')}</div><div><b>10 Sep 2026</b> · Kontrol Diabetes<br><span class="sub">Hadir. Obat dilanjutkan sesuai instruksi dokter.</span></div><div><b>12 Agu 2026</b> · Kontrol Diabetes<br><span class="sub">Hadir. Target monitoring disepakati.</span></div></div></div><div class="card"><h2>Catatan dokter</h2>${S.notes.map(n=>`<div class="alert a-inf"><span class="i">📝</span><div>${n}</div></div>`).join('')}</div>`;
return `<div class="tabs">${T.map(([k,l])=>`<button class="tab ${t==k?'on':''}" onclick="S.rt='${k}';render()">${l}</button>`).join('')}</div>`+(t=='obat'?medHist():t=='luka'?luka:t=='kontrol'?kontrol:stokView())}
const SQ=[['age','Usia saat gejala/diagnosis pertama muncul?',['Di bawah 30 tahun','30–45 tahun','Di atas 45 tahun']],['preg','Sedang hamil, atau gula darah tinggi baru terdeteksi saat hamil?',['Ya','Tidak']],['onset','Bagaimana gejala muncul?',['Mendadak (hitungan minggu)','Bertahap (bulan–tahun)','Belum ada gejala']],['wl','Berat badan turun drastis tanpa sebab?',['Ya','Tidak']],['bmi','Bentuk tubuh Anda?',['Kurus','Normal','Gemuk / obesitas']],['f2','Orang tua/saudara kandung dengan diabetes tipe 2?',['Ya','Tidak','Tidak tahu']],['ai','Riwayat diabetes tipe 1 atau penyakit autoimun (mis. tiroid) pada diri/keluarga?',['Ya','Tidak','Tidak tahu']],['ins','Sejak awal didiagnosis langsung diberi insulin?',['Ya','Tidak']]];
const scrForm=(b,fn)=>SQ.map(([k,q,o])=>`<label>${q}</label><div class="radio">${o.map(x=>`<label><input type="radio" name="${k}" value="${x}">${x}</label>`).join('')}</div>`).join('')+`<button class="btn" style="width:100%;margin-top:1rem" onclick="${fn}()">${b}</button>`;
function scrDo(){const v=k=>document.querySelector(`[name=${k}]:checked`)?.value;if(SQ.some(q=>!v(q[0]))){toast('Jawab semua pertanyaan dulu.');return false}
let a=0,b=0;const age=v('age');if(age.startsWith('Di bawah'))a+=2;else if(age.startsWith('Di atas'))b+=2;else b+=1;
if(v('onset').startsWith('Mendadak'))a+=2;else if(v('onset').startsWith('Bertahap'))b+=1;if(v('wl')=='Ya')a+=1;if(v('bmi')=='Kurus')a+=1;if(v('bmi').startsWith('Gemuk'))b+=2;if(v('f2')=='Ya')b+=1;if(v('ai')=='Ya')a+=1;if(v('ins')=='Ya')a+=2;
const r=v('preg')=='Ya'?'Gestasional':a>=4&&a>=b?'Tipe 1':b>=3?'Tipe 2':'Belum pasti';S.dtype=r;S.scr={r,urg:v('onset').startsWith('Mendadak')&&v('wl')=='Ya'};return true}
function scrRes(){const r=S.scr.r,t={'Tipe 1':'Pola jawaban mengarah ke diabetes tipe 1 (autoimun, biasanya muncul mendadak pada usia muda dan butuh insulin). Perlu konfirmasi dokter, mis. HbA1c, antibodi, dan C-peptide.','Tipe 2':'Pola jawaban mengarah ke diabetes tipe 2 (resistensi insulin, terkait usia, berat badan, dan riwayat keluarga). Konfirmasi lewat gula darah puasa, GD2PP, atau HbA1c.','Gestasional':'Kehamilan membuat kemungkinan diabetes gestasional perlu diperiksa (mis. TTGO) oleh dokter kandungan. Umumnya membaik setelah melahirkan, tetapi risiko tipe 2 meningkat.','Belum pasti':'Jawaban belum cukup untuk menduga jenisnya. Tetap lakukan pemeriksaan gula darah dan HbA1c di fasilitas kesehatan.'}[r];
return `<div class="card"><h2>Hasil screening</h2><p>${bd(r=='Belum pasti'?'inf':'warn','Dugaan awal: '+(r=='Belum pasti'?r:'Diabetes '+r.toLowerCase()))}</p><p style="margin:.6rem 0">${t}</p>${S.scr.urg?al('bad','🚑','Gejala mendadak + berat badan turun','Segera periksa ke fasilitas kesehatan. Jika mual, muntah, napas cepat, atau bingung: ke IGD.'):''}<p class="sub">Ini bukan diagnosis. Diagnosis hanya dari tes laboratorium oleh dokter. Jenis lain (mis. MODY, LADA, akibat obat/penyakit lain) tidak tercakup.</p></div>`}
/* ===== LOGIN, DAFTAR & SCREENING ===== */
/* Akun demo saja: password demo memang tertulis di kode */
const DEMO={'siti@mail.id':['patient','Ibu Siti'],'andi@mail.id':['caregiver','Andi'],'dr.andi@klinik.id':['doctor','dr. Andi']};
function authView(){const a=S.auth,tab=(k,l)=>`<button class="tab ${a==k?'on':''}" onclick="S.auth='${k}';render()">${l}</button>`,logo=`<div class="logo" style="padding:0;font-size:2rem">Care<span>Diabetes</span></div>`,wrap=h=>`<div class="login"><div class="card" style="width:min(560px,100%)">${logo}${h}</div></div>`;
if(a=='screen')return wrap(`<h2 style="margin-top:1rem">Screening jenis diabetes</h2><p class="sub">8 pertanyaan singkat untuk menduga jenis diabetes. Bukan diagnosis.</p>${scrForm('Lihat hasil','regScr')}<button class="btn alt sm" style="margin-top:.6rem;width:100%" onclick="finishReg()">Lewati dulu</button>`);
if(a=='result')return wrap(scrRes()+`<button class="btn" style="width:100%" onclick="finishReg()">Lanjut ke Dashboard</button>`);
if(a=='register')return wrap(`<div class="tabs" style="margin-top:1rem">${tab('login','Masuk')}${tab('register','Daftar')}</div><label>Daftar sebagai</label><div class="radio">${[['patient','Pasien'],['caregiver','Keluarga'],['doctor','Dokter']].map(([v,l],i)=>`<label><input type="radio" name="rl" value="${v}" ${i==0?'checked':''}>${l}</label>`).join('')}</div><label for="rn">Nama lengkap</label><input id="rn" autocomplete="name"><label for="re">Email</label><input id="re" type="email" autocomplete="email"><label for="rp">Password (min. 8 karakter)</label><input id="rp" type="password" autocomplete="new-password"><label for="rp2">Ulangi password</label><input id="rp2" type="password" autocomplete="new-password"><label style="display:flex;gap:.5rem;font-weight:400;align-items:center"><input id="rc" type="checkbox" style="width:22px;min-height:0"> Saya setuju data kesehatan saya disimpan dan hanya dilihat orang yang saya beri akses.</label><button class="btn" style="width:100%;margin-top:1rem" onclick="doRegister()">Daftar</button><p class="sub" style="margin-top:.6rem">Pasien akan diminta mengisi screening jenis diabetes.</p>`);
return wrap(`<div class="tabs" style="margin-top:1rem">${tab('login','Masuk')}${tab('register','Daftar')}</div><p class="sub" style="margin-bottom:.5rem">Mendampingi kesehatan Anda, setiap hari.</p><label for="em">Email / username</label><input id="em" autocomplete="username" placeholder="nama@email.com"><label for="pw">Password</label><input id="pw" type="password" autocomplete="current-password"><div class="row" style="margin:.8rem 0"><a href="#" onclick="toast('Tautan atur ulang dikirim ke email Anda.');return false" style="color:var(--pri)">Lupa password</a></div><button class="btn" style="width:100%" onclick="doLogin()">Login</button><p class="sub" style="margin:1.2rem 0 .5rem">Coba akun demo:</p><div class="acts" style="margin:0">${[['siti@mail.id','Pasien'],['andi@mail.id','Keluarga'],['dr.andi@klinik.id','Dokter']].map(([e,l])=>`<button class="btn alt sm" style="min-width:90px" onclick="$('#em').value='${e}';$('#pw').value='demo1234';doLogin()">${l}</button>`).join('')}</div>`)}
async function doRegister(){const n=$('#rn').value.trim(),e=$('#re').value.toLowerCase().trim(),p=$('#rp').value,r=document.querySelector('[name=rl]:checked').value;
if(!n||!/\S+@\S+\.\S+/.test(e)){toast('Isi nama dan email yang valid.');return}if(p.length<8){toast('Password minimal 8 karakter.');return}if(p!=$('#rp2').value){toast('Password tidak sama.');return}if(!$('#rc').checked){toast('Setujui penyimpanan data terlebih dahulu.');return}
if(DEMO[e]||S.users.some(u=>u.e==e)){toast('Email sudah terdaftar. Silakan login.');return}
const s=hex(crypto.getRandomValues(new Uint8Array(16)));S.pend={n,e,s,h:await hashPw(p,s),r};S.users.push(S.pend);if(r=='patient'){S.auth='screen';render()}else finishReg()}
function regScr(){if(scrDo()){S.auth='result';render()}}
function pgScr(){if(scrDo()){render();scrollTo(0,0)}}
function finishReg(){S.role=S.pend.r;S.name=S.pend.n;S.page='dash';S.auth='login';render()}

render();
</script></body></html>
